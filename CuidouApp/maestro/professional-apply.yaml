appId: com.cuidou.app
---
# Conta criada por prisma db seed (LOCAL_DEV_CAREGIVER_EMAIL/LOCAL_DEV_PASSWORD).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 10000
- tapOn:
    id: "auth-email-input"
- inputText: "cuidadora.local@cuidou.dev"
- tapOn:
    id: "auth-password-input"
- inputText: "Cuidou123!"
- tapOn:
    id: "auth-submit-button"
- extendedWaitUntil:
    visible:
      id: "professional-marketplace-button"
    timeout: 10000

- tapOn:
    id: "professional-marketplace-button"
- extendedWaitUntil:
    visible:
      id: "marketplace-job-card-0"
    timeout: 10000
- tapOn:
    id: "marketplace-job-card-0"
- tapOn:
    id: "application-submit-button"
- assertVisible: "Candidatura enviada"
