appId: com.cuidou.app
---
- launchApp:
    clearState: true

- assertVisible:
    id: "auth-email-input"
- assertVisible:
    id: "auth-password-input"
- tapOn:
    id: "auth-email-input"
- inputText: "familia.local@cuidou.dev"
- tapOn:
    id: "auth-password-input"
- inputText: "Cuidou123!"
- tapOn:
    id: "auth-submit-button"

- extendedWaitUntil:
    notVisible:
      id: "auth-submit-button"
    timeout: 10000

- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "family-section-family-jobs"
    timeout: 10000
