appId: com.cuidou.app
---
# Conta criada por prisma db seed (LOCAL_DEV_FAMILY_EMAIL/LOCAL_DEV_PASSWORD).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 10000
- tapOn:
    id: "auth-email-input"
- inputText: "familia.local@cuidou.dev"
- tapOn:
    id: "auth-password-input"
- inputText: "Cuidou123!"
- tapOn:
    id: "auth-submit-button"
- extendedWaitUntil:
    visible:
      id: "family-section-family-jobs"
    timeout: 10000

- tapOn:
    id: "family-section-family-jobs"
- tapOn:
    id: "family-create-job"
- tapOn:
    id: "job-title-input"
- inputText: "Babysitter para crianca"
- tapOn:
    id: "job-description-input"
- inputText: "Precisamos de apoio para nossa familia tres vezes por semana."
- tapOn:
    id: "job-state-input"
- inputText: "SP"
- tapOn:
    id: "job-city-input"
- inputText: "Sao Paulo"
- tapOn:
    id: "job-submit-button"

- assertVisible: "Vaga criada"
